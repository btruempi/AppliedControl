<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applied Control Knowledge Graph Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #0f1923; color: #e0e8f0; height: 100vh; overflow: hidden; }
  #controls {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: rgba(15,25,35,0.95); border-bottom: 1px solid #1e3548;
    flex-wrap: wrap;
  }
  #search {
    flex: 1; min-width: 160px; max-width: 280px;
    padding: 6px 10px; border-radius: 6px;
    background: #1a2c3e; border: 1px solid #2a4a60; color: #e0e8f0;
    font-size: 13px;
  }
  #search::placeholder { color: #5a7a90; }
  .filter-btn {
    padding: 4px 9px; border-radius: 20px; border: 1px solid;
    font-size: 11px; cursor: pointer; white-space: nowrap;
    transition: opacity .15s;
  }
  .filter-btn.inactive { opacity: 0.35; }
  #info-panel {
    position: absolute; bottom: 0; left: 0; width: 300px;
    background: rgba(15,25,35,0.97); border-top: 1px solid #1e3548;
    border-right: 1px solid #1e3548; padding: 14px 16px;
    z-index: 10; max-height: 260px; overflow-y: auto;
    transition: transform .2s;
  }
  #info-panel.hidden { transform: translateY(100%); }
  .info-title { font-size: 15px; font-weight: 600; color: #7dd4c8; margin-bottom: 6px; }
  .info-tax { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #5a9090; margin-bottom: 8px; }
  .info-section { font-size: 12px; color: #8aa8b8; margin-top: 8px; }
  .info-section strong { color: #b0d0e0; display: block; margin-bottom: 3px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .dep-chip {
    display: inline-block; background: #1a3040; border: 1px solid #2a5060;
    border-radius: 12px; padding: 2px 7px; font-size: 11px; color: #7abacf;
    margin: 2px; cursor: pointer;
  }
  .dep-chip:hover { background: #2a4050; }
  #cis-badge {
    position: absolute; top: 10px; right: 10px; background: #0d3028;
    border: 1px solid #2a7b6e; border-radius: 6px; padding: 4px 10px;
    font-size: 11px; color: #3db09f; font-family: monospace;
  }
  #graph { width: 100%; height: 100vh; }
  #stats {
    position: absolute; top: 48px; right: 10px; font-size: 11px;
    color: #3a5a6a; font-family: monospace; text-align: right;
  }
  #close-info { float: right; background: none; border: none; color: #5a7a90; cursor: pointer; font-size: 16px; line-height: 1; }
  #close-info:hover { color: #e0e8f0; }
</style>
</head>
<body>

<div id="controls">
  <input id="search" type="text" placeholder="🔍 Search concepts…" oninput="filterSearch(this.value)">
  <span id="filter-btns"></span>
  <span style="font-size:11px;color:#3a5a6a;margin-left:auto;">490 concepts · 788 edges</span>
</div>
<div id="stats"></div>
<div id="graph"></div>
<div id="info-panel" class="hidden">
  <button id="close-info" onclick="document.getElementById('info-panel').classList.add('hidden')">✕</button>
  <div id="cis-badge">CIS: —</div>
  <div id="info-title" class="info-title">—</div>
  <div id="info-tax" class="info-tax">—</div>
  <div class="info-section" id="prereqs-section"><strong>Prerequisites (must know first)</strong><div id="prereqs">—</div></div>
  <div class="info-section" id="unlocks-section"><strong>Unlocks (concepts this enables)</strong><div id="unlocks">—</div></div>
</div>

<script>
const TAXONOMY = {
  "FUND":{"label":"Physics Fundamentals","color":"#1a6b5e"},
  "VLVB":{"label":"Valve Bodies & Types","color":"#1a5c8a"},
  "TRIM":{"label":"Valve Trim & Internals","color":"#2e6b3a"},
  "ACT": {"label":"Actuators & Positioners","color":"#7b4b2b"},
  "SIZE":{"label":"Valve Sizing & Selection","color":"#5c3a8a"},
  "CTRL":{"label":"Control Systems","color":"#8a5c1a"},
  "SAFE":{"label":"Safety & Relief","color":"#8a2b2b"},
  "MEAS":{"label":"Measurement","color":"#2b5c8a"},
  "RELY":{"label":"Asset Reliability","color":"#4b6b2b"},
  "APPL":{"label":"Industry Applications","color":"#6b2b7b"},
  "STND":{"label":"Standards & Codes","color":"#2b6b6b"},
  "SELL":{"label":"Sales Engineering","color":"#8a6b2b"},
};

let graphData = null;
let network = null;
let activeFilters = new Set(Object.keys(TAXONOMY));
let allNodes = null, allEdges = null;
let nodeMap = {};

fetch('learning-graph.json')
  .then(r => r.json())
  .then(data => {
    graphData = data;
    initGraph(data);
    buildFilterButtons();
  })
  .catch(() => {
    // Fallback: show message
    document.getElementById('graph').innerHTML = '<div style="padding:2rem;color:#5a7a90;text-align:center;margin-top:4rem;">Loading graph data… <br><small>Ensure learning-graph.json is in the same directory.</small></div>';
  });

function initGraph(data) {
  nodeMap = {};
  data.nodes.forEach(n => { nodeMap[n.id] = n; });

  // Build reverse lookup (who depends on me)
  const unlocks = {};
  data.nodes.forEach(n => { unlocks[n.id] = []; });
  data.edges.forEach(e => { if (unlocks[e.to]) unlocks[e.to].push(e.from); });
  data.nodes.forEach(n => { n.unlocks = unlocks[n.id] || []; });

  const maxCis = Math.max(...data.nodes.map(n => n.cis));

  allNodes = new vis.DataSet(data.nodes.map(n => {
    const tax = TAXONOMY[n.group];
    const sz = 8 + (n.cis / maxCis) * 32;
    return {
      id: n.id,
      label: n.label,
      title: n.label,
      group: n.group,
      size: sz,
      color: { background: tax.color, border: lighten(tax.color, 40), highlight: { background: '#3db09f', border: '#7dd4c8' } },
      font: { color: '#c8dce8', size: sz > 22 ? 13 : 11 },
      borderWidth: 1.5,
    };
  }));

  allEdges = new vis.DataSet(data.edges.map((e,i) => ({
    id: i, from: e.from, to: e.to,
    arrows: { to: { enabled: true, scaleFactor: 0.5 } },
    color: { color: '#1e3548', highlight: '#3db09f', opacity: 0.6 },
    width: 0.8,
    smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.4 }
  })));

  const container = document.getElementById('graph');
  const options = {
    layout: { hierarchical: { enabled: false } },
    physics: {
      stabilization: { iterations: 180 },
      barnesHut: { gravitationalConstant: -4000, centralGravity: 0.3, springLength: 95, springConstant: 0.04, damping: 0.09 },
    },
    interaction: { hover: true, multiselect: false, tooltipDelay: 200 },
    nodes: { shape: 'dot', scaling: { min: 8, max: 40 } },
    edges: { smooth: { type: 'continuous' } },
  };
  network = new vis.Network(container, { nodes: allNodes, edges: allEdges }, options);

  network.on('click', params => {
    if (params.nodes.length > 0) showInfo(params.nodes[0]);
    else document.getElementById('info-panel').classList.add('hidden');
  });

  network.on('stabilizationProgress', p => {
    document.getElementById('stats').textContent = `Stabilizing… ${Math.round(p.iterations/p.total*100)}%`;
  });
  network.on('stabilizationIterationsDone', () => {
    document.getElementById('stats').textContent = '';
  });
}

function showInfo(nid) {
  const n = nodeMap[nid];
  if (!n) return;
  const tax = TAXONOMY[n.group];
  document.getElementById('info-title').textContent = n.label;
  document.getElementById('info-tax').textContent = tax.label;
  document.getElementById('cis-badge').textContent = `CIS: ${n.cis}`;
  document.getElementById('info-panel').classList.remove('hidden');

  const prereqEl = document.getElementById('prereqs');
  if (n.deps && n.deps.length > 0) {
    prereqEl.innerHTML = n.deps.map(d => {
      const dn = nodeMap[d];
      return dn ? `<span class="dep-chip" onclick="showInfo(${d})">${dn.label}</span>` : '';
    }).join('');
  } else {
    prereqEl.innerHTML = '<em style="color:#3a5a6a">Foundation concept — no prerequisites</em>';
  }

  const unlockEl = document.getElementById('unlocks');
  if (n.unlocks && n.unlocks.length > 0) {
    const shown = n.unlocks.slice(0, 12);
    unlockEl.innerHTML = shown.map(d => {
      const dn = nodeMap[d];
      return dn ? `<span class="dep-chip" onclick="showInfo(${d})">${dn.label}</span>` : '';
    }).join('') + (n.unlocks.length > 12 ? `<span style="color:#3a5a6a;font-size:11px"> +${n.unlocks.length-12} more</span>` : '');
  } else {
    unlockEl.innerHTML = '<em style="color:#3a5a6a">Terminal concept</em>';
  }

  network.selectNodes([nid]);
  network.focus(nid, { scale: 1.2, animation: { duration: 500 } });
}

function buildFilterButtons() {
  const el = document.getElementById('filter-btns');
  el.style.display = 'flex'; el.style.gap = '4px'; el.style.flexWrap = 'wrap';
  Object.entries(TAXONOMY).forEach(([k, v]) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = v.label.replace('& ','');
    btn.style.borderColor = v.color;
    btn.style.color = v.color;
    btn.style.background = 'rgba(0,0,0,0.3)';
    btn.dataset.key = k;
    btn.onclick = () => toggleFilter(k, btn);
    el.appendChild(btn);
  });
}

function toggleFilter(key, btn) {
  if (activeFilters.has(key)) {
    activeFilters.delete(key);
    btn.classList.add('inactive');
  } else {
    activeFilters.add(key);
    btn.classList.remove('inactive');
  }
  applyFilters();
}

function applyFilters() {
  if (!allNodes || !network) return;
  const hidden = new Set();
  allNodes.forEach(n => { if (!activeFilters.has(n.group)) hidden.add(n.id); });
  allNodes.forEach(n => {
    allNodes.update({ id: n.id, hidden: hidden.has(n.id) });
  });
}

function filterSearch(q) {
  if (!allNodes || !network) return;
  if (!q.trim()) { applyFilters(); return; }
  const lower = q.toLowerCase();
  let found = null;
  allNodes.forEach(n => {
    const match = n.label.toLowerCase().includes(lower);
    allNodes.update({ id: n.id, hidden: !match });
    if (match && !found) found = n.id;
  });
  if (found) {
    network.selectNodes([found]);
    network.focus(found, { scale: 1.5, animation: { duration: 600 } });
    showInfo(found);
  }
}

function lighten(hex, amount) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, (num >> 16) + amount);
  const g = Math.min(255, ((num >> 8) & 0xff) + amount);
  const b = Math.min(255, (num & 0xff) + amount);
  return `rgb(${r},${g},${b})`;
}
</script>
</body>
</html>
