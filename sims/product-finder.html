let answers={},currentStep=0;
const steps=['purpose','fluid','pressure','priority','failsafe'];

function getBreadcrumb(){
  let p=[];
  steps.forEach(k=>{
    if(answers[k]){
      let q=questions.find(q=>q.id===k);
      let o=q.options.find(o=>o.val===answers[k]);
      if(o)p.push(o.title);
    }
  });
  return p.length?p.join(' → '):'Starting your selection…';
}

function updateSteps(active){
  for(let i=1;i<=5;i++){
    const dot=document.getElementById('s'+i);
    const line=document.getElementById('l'+i);
    if(i<active+1){dot.className='step-dot done';dot.textContent='✓';}
    else if(i===active+1){dot.className='step-dot active';dot.textContent=i;}
    else{dot.className='step-dot';dot.textContent=i;}
    if(line){line.className=i<=active?'step-line done':'step-line';}
  }
}

function renderQuestion(si){
  const q=questions[si];
  updateSteps(si);
  document.getElementById('breadcrumb').innerHTML=`Step ${si+1} of 5 — <span>${q.q}</span> | ${getBreadcrumb()}`;
  document.getElementById('questionContainer').innerHTML=`
    <div class="question-card">
      <h2>${q.q}</h2><p class="q-sub">${q.sub}</p>
      <div class="options-grid">${q.options.map(o=>`
        <button class="option-btn" onclick="pick('${q.id}','${o.val}')">
          <span class="opt-icon">${o.icon}</span>
          <span class="opt-title">${o.title}</span>
          <span class="opt-desc">${o.desc}</span>
        </button>`).join('')}
      </div>
    </div>`;
}

function pick(id,val){
  answers[id]=val;
  if(currentStep<steps.length-1){currentStep++;renderQuestion(currentStep);}
  else showResult();
}

function lookup(){
  const k=`${answers.purpose}-${answers.fluid}-${answers.pressure}-${answers.priority}-${answers.failsafe}`;
  if(R[k])return R[k];
  const k4=`${answers.purpose}-${answers.fluid}-${answers.pressure}-${answers.priority}`;
  const m4=Object.keys(R).find(x=>x.startsWith(k4));
  if(m4)return R[m4];
  const k3=`${answers.purpose}-${answers.fluid}-${answers.pressure}`;
  const m3=Object.keys(R).find(x=>x.startsWith(k3));
  if(m3)return R[m3];
  const k2=`${answers.purpose}-${answers.fluid}`;
  const m2=Object.keys(R).find(x=>x.startsWith(k2));
  if(m2)return R[m2];
  return R.default;
}

function showResult(){
  const rec=lookup();
  updateSteps(5);
  document.getElementById('breadcrumb').innerHTML=`<span>✅ Recommendation Ready</span> | ${getBreadcrumb()}`;
  document.getElementById('questionContainer').innerHTML=`
    <div class="result-card">
      <div class="result-header">
        <div class="result-badge">
          <div class="rb-label">Recommended</div>
          <div class="rb-product">${rec.valve}</div>
          <div class="rb-series">${rec.category}</div>
        </div>
        <div class="result-tagline">
          <h2>${rec.series}</h2>
          <p>${rec.body}</p>
        </div>
      </div>
      <div class="spec-grid">
        <div class="spec-item"><div class="s-label">Body / Construction</div><div class="s-value">${rec.body}</div></div>
        <div class="spec-item"><div class="s-label">Trim</div><div class="s-value">${rec.trim}</div></div>
        <div class="spec-item"><div class="s-label">Pressure Rating</div><div class="s-value">${rec.pressure}</div></div>
        <div class="spec-item"><div class="s-label">Temperature Range</div><div class="s-value">${rec.temp}</div></div>
        <div class="spec-item"><div class="s-label">Actuator</div><div class="s-value">${rec.actuator}</div></div>
        <div class="spec-item"><div class="s-label">Positioner</div><div class="s-value">${rec.positioner}</div></div>
      </div>
      <div class="actuator-section">
        <h3>🔧 Actuator Selection Guide</h3>
        <div class="actuator-grid">${rec.actuatorGuide.map(a=>`
          <div class="actuator-item">
            <div class="a-name">${a.name}</div>
            <div class="a-use">${a.use}</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="why-box"><h4>🔬 Why This Valve</h4><p>${rec.why}</p></div>
      <div class="sales-box"><h4>💼 Sales Conversation Starter</h4><p>${rec.sales}</p></div>
      <div class="dvc-reminder"><strong>🎯 DVC6200 / Positioner Opportunity:</strong> ${rec.dvc}</div>
      ${rec.alt?`<div class="alt-section"><h4>Also Consider</h4><div class="alt-chips">${rec.alt.map(a=>`<button class="alt-chip">${a}</button>`).join('')}</div></div>`:''}
      <div class="action-buttons">
        <button class="btn-primary" onclick="reset()">🔄 New Selection</button>
        <button class="btn-secondary" onclick="window.open('https://www.appliedcontrol.com','_blank')">Visit Applied Control →</button>
      </div>
    </div>`;
}

function reset(){answers={};currentStep=0;renderQuestion(0);}
renderQuestion(0);
</script>
